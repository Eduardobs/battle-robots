<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151d">
  <meta name="description" content="Configure dois robôs e acompanhe um duelo autônomo na arena.">
  <title data-t="title">Battle Robots</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/hangar.css">
  <link rel="stylesheet" href="./styles/arena.css">
  <link rel="stylesheet" href="./styles/battle-report.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-icon" data-icon="mark"></span><span><span data-t="brandFirst">BATTLE</span> <span class="brand-accent" data-t="brandLast">ROBOTS</span></span></div>
      <nav class="stages" data-t-label="stages">
        <span id="stage-hangar" aria-current="step"><span data-icon="hangar"></span><span data-t="hangar"></span></span><b></b>
        <span id="stage-arena"><span data-icon="target"></span><span data-t="arena"></span></span><b></b>
        <span id="stage-result"><span data-icon="log"></span><span data-t="report.stage"></span></span>
      </nav>
      <div class="locale-control"><span data-icon="globe"></span><select id="language" class="language-select">
        <option value="pt-br" lang="pt-BR">Português (Brasil)</option>
        <option value="en" lang="en">English</option>
        <option value="es" lang="es">Español</option>
      </select><span data-icon="chevron"></span></div>
    </div>
  </header>
  <main class="shell">
    <section id="hangar" aria-labelledby="hangar-title">
      <div class="page-heading">
        <div>
          <h1 id="hangar-title" tabindex="-1" data-t="hangarTitle"></h1>
          <p class="intro" data-t="intro"></p>
        </div>
        <div class="match-summary"><span class="match-symbol" data-icon="clock"></span><div><span class="meta-label" data-t="duel"></span><strong id="match-length"></strong></div></div>
      </div>
      <div id="bays" class="bays"></div>
      <div class="hangar-status"><span class="readiness-lights" aria-hidden="true"><i></i><i></i></span><p id="ready-status" class="ready-status" role="status"></p></div>
    </section>
    <section id="arena" aria-labelledby="arena-title" hidden>
      <div class="page-heading arena-heading">
        <h1 id="arena-title" tabindex="-1" data-t="arenaTitle"></h1>
        <span id="battle-status" role="status"></span>
        <div id="battle-controls" hidden>
          <button class="ready-button" id="pause-battle" type="button"></button>
          <button class="ready-button" id="finish-battle" type="button" data-t="finishBattle"></button>
        </div>
        <button class="ready-button" id="view-result" type="button" data-t="report.view" hidden></button>
      </div>
      <div class="scoreboard" id="scoreboard"></div>
      <div class="arena-layout">
        <div class="arena-frame">
          <canvas id="field" width="1040" height="540" role="img" data-t-label="arenaLabel"></canvas>
        </div>
        <div class="battle-log">
          <h2><span data-icon="log"></span> <span data-t="battleLog"></span></h2>
          <div id="event-scroll" role="region" data-t-label="events" tabindex="0">
            <div class="event-columns" aria-hidden="true"><span data-t="time"></span><span data-t="robot"></span><span data-t="action"></span><span data-t="damage"></span></div>
            <ol id="events" data-t-label="events"></ol>
          </div>
          <div class="event-pager">
            <button id="older-events" type="button" data-t-label="olderEvents" data-t-title="olderEvents"><span data-icon="arrow"></span></button>
            <span id="event-range"></span>
            <button id="newer-events" type="button" data-t-label="newerEvents" data-t-title="newerEvents"><span data-icon="arrow"></span></button>
          </div>
        </div>
      </div>
    </section>
    <section id="result" class="battle-report" aria-labelledby="result-title" hidden>
      <header class="page-heading report-heading">
        <h1 id="result-title" tabindex="-1" data-t="report.title"></h1>
        <div class="report-actions">
          <button class="ready-button report-secondary" id="view-arena" type="button" data-t="report.viewArena"></button>
          <button class="ready-button" id="reset" type="button" data-t="back"></button>
        </div>
      </header>
      <div class="report-outcome" id="result-outcome">
        <span class="report-trophy" data-icon="trophy"></span>
        <div class="report-verdict">
          <p class="eyebrow" id="result-reason"></p>
          <h2 id="result-winner"></h2>
        </div>
        <div class="match-summary">
          <span class="match-symbol" data-icon="clock"></span>
          <div><span class="meta-label" data-t="report.duration"></span><strong id="result-duration"></strong></div>
        </div>
        <div id="result-score"></div>
      </div>
      <div id="report-comparison" class="report-comparison"></div>
      <section aria-labelledby="report-weapons-title">
        <h2 id="report-weapons-title" class="report-section-title" data-t="report.byWeapon"></h2>
        <div id="report-weapons" class="report-weapons"></div>
      </section>
      <details class="report-notes">
        <summary data-t="report.notes"></summary>
        <p data-t="report.accuracyNote"></p>
        <p data-t="report.damageNote"></p>
        <p data-t="report.defenseNote"></p>
      </details>
    </section>
  </main>
</body>
</html>
