<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <meta name="description" content="Configure dois robôs e acompanhe um duelo autônomo na arena.">
  <title data-t="title">Battle Robots</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-icon" data-icon="swords"></span><span><span data-t="brandFirst">BATTLE</span> <span class="brand-accent" data-t="brandLast">ROBOTS</span></span></div>
      <nav class="stages" data-t-label="stages">
        <span id="stage-hangar" aria-current="step"><i></i><span data-t="hangar"></span></span><b></b><span id="stage-arena"><i></i><span data-t="arena"></span></span>
      </nav>
      <select id="language" class="language-select">
        <option value="pt-br" lang="pt-BR">Português (Brasil)</option>
        <option value="en" lang="en">English</option>
        <option value="es" lang="es">Español</option>
      </select>
    </div>
  </header>
  <main class="shell">
    <section id="hangar" aria-labelledby="hangar-title">
      <div class="page-heading">
        <div>
          <p class="eyebrow" data-t="preparation"></p>
          <h1 id="hangar-title" data-t="hangarTitle"></h1>
          <p class="intro" data-t="intro"></p>
        </div>
        <span class="mode"><span data-icon="clock"></span><span id="match-length"></span></span>
      </div>
      <div id="bays" class="bays"></div>
      <p id="ready-status" class="ready-status" role="status"></p>
    </section>
    <section id="arena" aria-labelledby="arena-title" hidden>
      <div class="page-heading arena-heading">
        <div>
          <p class="eyebrow" data-t="duel"></p>
          <h1 id="arena-title" tabindex="-1" data-t="arenaTitle"></h1>
        </div>
        <span class="mode" id="battle-status"></span>
      </div>
      <div class="scoreboard" id="scoreboard"></div>
      <div class="arena-layout">
        <div class="robot-details-stack">
          <aside id="robot-details-0" class="robot-details orange" aria-labelledby="robot-title-0"></aside>
          <aside id="robot-details-1" class="robot-details blue" aria-labelledby="robot-title-1"></aside>
        </div>
        <div class="arena-frame">
          <canvas id="field" width="1040" height="540" role="img" data-t-label="arenaLabel"></canvas>
          <div class="result-overlay" id="result" hidden>
            <div class="result-card">
              <p class="eyebrow" id="result-reason"></p>
              <h2 id="result-title" tabindex="-1"></h2>
              <p id="result-score"></p>
              <button id="reset" class="ready-button" type="button" data-t="back"></button>
            </div>
          </div>
        </div>
        <div class="battle-log">
          <h2><span data-icon="log"></span> <span data-t="battleLog"></span></h2>
          <div id="event-scroll" role="region" data-t-label="events" tabindex="0">
            <div class="event-columns" aria-hidden="true"><span data-t="time"></span><span data-t="robot"></span><span data-t="action"></span><span data-t="damage"></span></div>
            <ol id="events" data-t-label="events"></ol>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
